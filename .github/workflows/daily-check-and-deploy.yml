name: Public Funding Radar - Daily Check and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
permissions:
  contents: read
concurrency:
  group: funding-radar-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bounded attachment parsers
        run: python -m pip install -r requirements-attachments.txt
      - name: Attachment extraction and evidence regressions
        run: |
          python -m unittest discover -s scripts -p test_attachments.py -v
          node --test scripts/test_attachments.cjs
      - name: Legacy compatibility tests
        run: python scripts/test_refresh.py
      - name: Evidence and collection regressions
        run: python -m unittest discover -s scripts -p test_radar_v2.py -v
      - name: Deadline and presentation regressions
        run: node --test scripts/test_frontend.cjs
      - name: Condition registry and evidence safety regressions
        run: python -m unittest discover -s scripts -p test_conditions.py -v
      - name: Local eligibility and privacy regressions
        run: node --test scripts/test_eligibility.cjs scripts/test_eligibility_ui.cjs
      - name: Source-bound funding and private scenario regressions
        run: |
          python -m unittest discover -s scripts -p test_planning.py -v
          node --test scripts/test_planning.cjs scripts/test_planning_ui.cjs
      - name: Historical startup reference and privacy regressions
        run: |
          python -m unittest discover -s scripts -p test_startup.py -v
          node --test scripts/test_startup.cjs scripts/test_startup_ui.cjs
      - name: Source-bound cash timing and privacy regressions
        run: |
          node --test scripts/test_cashflow.cjs scripts/test_cashflow_ui.cjs
          python -m unittest discover -s scripts -p test_cashflow_contract.py -v
      - name: Portfolio cost allocation and privacy regressions
        run: |
          node --test scripts/test_portfolio.cjs scripts/test_portfolio_ui.cjs
          python -m unittest discover -s scripts -p test_portfolio_contract.py -v
      - name: Script syntax and public schema
        run: |
          node --check assets/app.js
          node --check assets/eligibility-core.js
          node --check assets/eligibility-ui.js
          node --check assets/planning-core.js
          node --check assets/planning-ui.js
          node --check assets/startup-core.js
          node --check assets/startup-ui.js
          node --check assets/cashflow-core.js
          node --check assets/cashflow-ui.js
          node --check assets/portfolio-core.js
          node --check assets/portfolio-ui.js
          python -m compileall -q scripts
          python scripts/build_public.py
  update-and-publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded attachment parsers
        run: python -m pip install -r requirements-attachments.txt
      - name: Refresh public evidence
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python scripts/refresh_v2.py
      - name: Read linked official attachment bodies
        id: attachments
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/refresh_attachments.py
      - name: Recheck reviewed historical startup originals
        id: startup_sources
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/refresh_startup_sources.py
      - name: Build condition catalog and validate before any public commit
        run: |
          python scripts/condition_catalog.py
          python scripts/funding_catalog.py
          python scripts/startup_catalog.py
          python scripts/validate.py
      - name: Commit allowlisted public records only
        run: |
          if [[ -n "$(git status --porcelain -- data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/programs.json data/monitor.json data/evidence.json data/change_reviews.json data/conditions.json data/attachments.json data/funding_rules.json data/startup_routes.json data/startup_sources.json
            git commit -m "chore: record public discovery and evidence review"
            git fetch origin main
            git rebase origin/main
            # Another editorial writer may have advanced program metadata during collection.
            # Rebuild and commit the derived catalog after rebase, before pushing/deploying.
            python scripts/condition_catalog.py
            python scripts/funding_catalog.py
            python scripts/startup_catalog.py
            python scripts/validate.py
            if ! git diff --quiet -- data/conditions.json data/funding_rules.json data/startup_routes.json; then
              git add data/conditions.json data/funding_rules.json data/startup_routes.json
              git commit -m "chore: align condition catalog with rebased public records"
            fi
            git push origin HEAD:main
          fi
      - name: Build only public artifacts
        run: python scripts/build_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Surface collector failure after publishing honest status
        if: steps.refresh.outcome == 'failure' || steps.attachments.outcome == 'failure' || steps.startup_sources.outcome == 'failure'
        run: |
          echo '::error::Collection incomplete/failed. Previous records preserved; see public source audit.'
          exit 1
