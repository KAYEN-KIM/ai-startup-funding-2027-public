name: Public Funding Radar - Daily Check and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
permissions:
  contents: read
concurrency:
  group: funding-radar-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Legacy compatibility tests
        run: python scripts/test_refresh.py
      - name: Evidence and collection regressions
        run: python -m unittest discover -s scripts -p test_radar_v2.py -v
      - name: Deadline and presentation regressions
        run: node --test scripts/test_frontend.cjs
      - name: Script syntax and public schema
        run: |
          node --check assets/app.js
          python -m compileall -q scripts
          python scripts/build_public.py
  update-and-publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public evidence
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python scripts/refresh_v2.py
      - name: Validate before any public commit
        run: python scripts/validate.py
      - name: Commit allowlisted public records only
        run: |
          if [[ -n "$(git status --porcelain -- data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/programs.json data/monitor.json data/evidence.json data/change_reviews.json
            git commit -m "chore: record public discovery and evidence review"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Build only public artifacts
        run: python scripts/build_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Surface collector failure after publishing honest status
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::error::Collection incomplete/failed. Previous records preserved; see public source audit.'
          exit 1
